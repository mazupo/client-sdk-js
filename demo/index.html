<!DOCTYPE html>
<html>

<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <title>@mazupo/client demo</title>
</head>

<body>
  <div>
    <div>
      <video id="videoElement" controls autoplay playsinline>
        Your browser doesn't support HTML5 video.
      </video>
    </div>
    <div>
      <label>Device UID: <input type="text" id="uid" placeholder="Device UID"></label><br>
      <label>MQTT Host: <input type="text" id="mqttHost" placeholder="MQTT Host"></label><br>
      <label>MQTT Path: <input type="text" id="mqttPath" placeholder="MQTT Path" value="/mqtt"></label><br>
      <label>MQTT Port: <input type="number" id="mqttPort" placeholder="MQTT Port" value="8084"></label><br>
      <label>MQTT Username: <input type="text" id="mqttUsername" placeholder="MQTT Username"></label><br>
      <label>MQTT Password: <input type="password" id="mqttPassword" placeholder="MQTT Password"></label><br>
    </div>
    <div>
      <button onclick="start()">Start</button>
      <button onclick="stop()">Stop</button>
    </div>
    <div>
      <label>Jitter buffer target:
        <input type="range" id="jitterBufferTarget" min="0" max="500" step="10" value="0"
          oninput="setJitterBufferTarget(this.value)">
        <span id="jitterBufferTargetValue">0</span> ms
      </label>
    </div>

    <hr>

    <div>
      <video id="sfuVideoElement" controls autoplay playsinline>
        Your browser doesn't support HTML5 video.
      </video>
    </div>
    <div>
      <label>LiveKit url: <input type="text" id="livekitUrl" placeholder="LiveKit relay URL"
          value="wss://api.mazupo.com"></label><br>
      <label>LiveKit key: <input type="text" id="livekitKey" placeholder="LiveKit Key"
          value="APIWnQTs4tmUZvA"></label><br>
      <label>Room: <input type="text" id="livekitRoom" placeholder="Room Id" value="my-first-room"></label><br>
    </div>
    <div>
      <button onclick="join()">Join</button>
      <button onclick="leave()">Leave</button>
    </div>

    <hr>

    <div>
      <video id="cfVideoElement" controls autoplay playsinline>
        Your browser doesn't support HTML5 video.
      </video>
    </div>
    <div>
      <label>API url: <input type="text" id="apiUrl" placeholder="Device API URL"
          value="https://api.mazupo.com"></label><br>
      <label>API key: <input type="text" id="apiKey" placeholder="Viewer API Key" value="ec0478c67e729b6f429eda1e97829af0"></label><br>
      <label>Device UID: <input type="text" id="cfUid" placeholder="Device UID"></label><br>
    </div>
    <div>
      <button onclick="pull()">Pull</button>
      <button onclick="drop()">Drop</button>
    </div>
  </div>

  <script type="module">
    import { PiCamera } from 'https://cdn.jsdelivr.net/npm/@mazupo/client@3/dist/index.esm.js';

    let videoRef = document.getElementById('videoElement');
    let conn = null;

    window.start = function start() {
      const uid = document.getElementById('uid').value;
      const mqttHost = document.getElementById('mqttHost').value;
      const mqttPath = document.getElementById('mqttPath').value;
      const mqttPort = parseInt(document.getElementById('mqttPort').value);
      const mqttUsername = document.getElementById('mqttUsername').value;
      const mqttPassword = document.getElementById('mqttPassword').value;

      conn = new PiCamera({
        uid: uid,
        mqttHost: mqttHost,
        mqttPath: mqttPath,
        mqttPort: mqttPort,
        mqttUsername: mqttUsername,
        mqttPassword: mqttPassword,
        stunUrls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"],
        jitterBufferTarget: Number(document.getElementById('jitterBufferTarget').value),
      });
      conn.onStream = (stream) => {
        videoRef.srcObject = stream;
      };
      conn.connect();
    };

    window.stop = function stop() {
      if (conn) {
        conn.terminate();
      }
    };

    window.setJitterBufferTarget = function setJitterBufferTarget(value) {
      const target = Number(value);
      document.getElementById('jitterBufferTargetValue').textContent = target;
      if (conn) {
        conn.setJitterBufferTarget(target);
      }
    };

    // ========
    // LiveKit demo 
    // ========
    let sfuVideoRef = document.getElementById('sfuVideoElement');
    let sfuConn = null;

    window.join = function join() {
      const livekitUrl = document.getElementById('livekitUrl').value;
      const livekitKey = document.getElementById('livekitKey').value;
      const livekitRoom = document.getElementById('livekitRoom').value;

      sfuConn = new PiCamera({
        signaling: 'livekit',
        livekitUrl: livekitUrl,
        livekitKey: livekitKey,
        livekitRoom: livekitRoom
      });
      sfuConn.onSfuStream = (sid, stream) => {
        sfuVideoRef.srcObject = stream;
      };
      sfuConn.connect();
    };

    window.leave = function leave() {
      if (sfuConn) {
        sfuConn.terminate();
      }
    };

    // ===============
    // Cloudflare demo
    // ===============
    let cfVideoRef = document.getElementById('cfVideoElement');
    let cfConn = null;

    window.pull = function pull() {
      const apiUrl = document.getElementById('apiUrl').value;
      const apiKey = document.getElementById('apiKey').value;
      const uid = document.getElementById('cfUid').value;

      cfConn = new PiCamera({
        signaling: 'cloudflare',
        apiUrl: apiUrl,
        apiKey: apiKey,
        uid: uid
      });
      cfConn.onSfuStream = (trackName, stream) => {
        console.log(`pulled ${trackName}`);
        cfVideoRef.srcObject = stream;
      };
      cfConn.onError = (err) => {
        console.error(err.message);
      };
      cfConn.connect();
    };

    window.drop = function drop() {
      if (cfConn) {
        cfConn.terminate();
      }
    };
  </script>
</body>

</html>
