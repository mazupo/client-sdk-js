<!DOCTYPE html>
<html>

<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <title>@mazupo/client demo</title>
</head>

<body>
  <div>
    <div>
      <video id="videoElement" controls autoplay playsinline>
        Your browser doesn't support HTML5 video.
      </video>
    </div>
    <div>
      <label>Device UID: <input type="text" id="uid" placeholder="Device UID"></label><br>
      <label>MQTT Host: <input type="text" id="mqttHost" placeholder="MQTT Host"></label><br>
      <label>MQTT Path: <input type="text" id="mqttPath" placeholder="MQTT Path" value="/mqtt"></label><br>
      <label>MQTT Port: <input type="number" id="mqttPort" placeholder="MQTT Port" value="8084"></label><br>
      <label>MQTT Username: <input type="text" id="mqttUsername" placeholder="MQTT Username"></label><br>
      <label>MQTT Password: <input type="password" id="mqttPassword" placeholder="MQTT Password"></label><br>
    </div>
    <div>
      <button onclick="start()">Start</button>
      <button onclick="stop()">Stop</button>
    </div>
    <div>
      <label>Jitter buffer target:
        <input type="range" id="jitterBufferTarget" min="0" max="500" step="10" value="0"
          oninput="setJitterBufferTarget(this.value)">
        <span id="jitterBufferTargetValue">0</span> ms
      </label>
    </div>

    <hr>

    <div>
      <video id="sfuVideoElement" controls autoplay playsinline>
        Your browser doesn't support HTML5 video.
      </video>
    </div>
    <div>
      <label>LiveKit url: <input type="text" id="livekitUrl" placeholder="LiveKit relay URL"
          value="wss://api.mazupo.com"></label><br>
      <label>LiveKit key: <input type="text" id="livekitKey" placeholder="LiveKit Key"
          value="APIWnQTs4tmUZvA"></label><br>
      <label>Room: <input type="text" id="livekitRoom" placeholder="Room Id" value="my-first-room"></label><br>
    </div>
    <div>
      <button onclick="join()">Join</button>
      <button onclick="leave()">Leave</button>
    </div>

    <hr>

    <div id="cfTiles"></div>
    <div>
      <label>API url: <input type="text" id="apiUrl" placeholder="cf-sfu-worker API URL"
          value="https://api.mazupo.com/cloudflare"></label><br>
      <label>Viewer key: <input type="text" id="apiKey" placeholder="Viewer public key" value="VIEWER_PUBLIC_KEY"></label><br>
      <label>Room: <input type="text" id="cfRoom" placeholder="Room"></label><br>
    </div>
    <div>
      <button onclick="joinRoom()">Join room</button>
      <button onclick="leaveRoom()">Leave room</button>
    </div>
  </div>

  <script type="module">
    import { CloudflareRoom, LiveKitRoom, MqttCamera } from 'https://cdn.jsdelivr.net/npm/@mazupo/client@4/dist/index.esm.js';

    let videoRef = document.getElementById('videoElement');
    let conn = null;

    window.start = function start() {
      conn = new MqttCamera({
        deviceId: document.getElementById('uid').value,
        host: document.getElementById('mqttHost').value,
        path: document.getElementById('mqttPath').value,
        port: parseInt(document.getElementById('mqttPort').value),
        username: document.getElementById('mqttUsername').value,
        password: document.getElementById('mqttPassword').value,
        stunUrls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"],
        jitterBufferTarget: Number(document.getElementById('jitterBufferTarget').value),
      });
      conn.onStream = (stream) => {
        videoRef.srcObject = stream;
      };
      conn.connect();
    };

    window.stop = function stop() {
      conn?.disconnect();
    };

    window.setJitterBufferTarget = function setJitterBufferTarget(value) {
      const target = Number(value);
      document.getElementById('jitterBufferTargetValue').textContent = target;
      if (conn) {
        conn.setJitterBufferTarget(target);
      }
    };

    // ========
    // LiveKit demo 
    // ========
    let sfuVideoRef = document.getElementById('sfuVideoElement');
    let sfuConn = null;

    window.join = function join() {
      sfuConn = new LiveKitRoom({
        url: document.getElementById('livekitUrl').value,
        apiKey: document.getElementById('livekitKey').value,
        roomId: document.getElementById('livekitRoom').value,
      });
      // Shows the first device in the room.
      sfuConn.onDevices = (devices) => {
        sfuVideoRef.srcObject = devices[0]?.stream ?? null;
      };
      sfuConn.connect();
    };

    window.leave = function leave() {
      sfuConn?.disconnect();
    };

    // ===============
    // Cloudflare demo
    // ===============
    let cfTiles = document.getElementById('cfTiles');
    let cfRoom = null;

    window.joinRoom = function joinRoom() {
      cfRoom = new CloudflareRoom({
        apiUrl: document.getElementById('apiUrl').value,
        apiKey: document.getElementById('apiKey').value,
        roomId: document.getElementById('cfRoom').value,
      });
      // One video for each device in the room.
      cfRoom.onDevices = (devices) => {
        for (const device of devices) {
          let video = document.getElementById(`cf-${device.deviceId}`);
          if (!video) {
            video = Object.assign(document.createElement('video'), {
              id: `cf-${device.deviceId}`, autoplay: true, playsInline: true, muted: true, controls: true,
            });
            cfTiles.append(video);
          }
          if (video.srcObject !== (device.stream ?? null)) {
            video.srcObject = device.stream ?? null;
          }
          video.title = `${device.deviceId}: ${device.state}`;
        }
      };
      cfRoom.onError = (err) => {
        console.error(err.code, err.message);
      };
      cfRoom.connect();
    };

    window.leaveRoom = function leaveRoom() {
      cfRoom?.disconnect();
      cfTiles.replaceChildren();
    };
  </script>
</body>

</html>
